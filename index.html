var FAQ={en:[
["Windows says \"Windows protected your PC\". Is it safe?","The installer is not code-signed yet, so Windows shows this for every new program. Click <b>More info</b>, then <b>Run anyway</b>. You can compare the file's SHA-256 with the one in the release notes."],
["Does any video leave my computer?","No. The picture goes from the device to your PC through the USB cable and is processed on your PC. There is no account and no cloud. Your video-call app only sends what you choose as the camera."],
["Why does the installer ask for administrator rights?","To add the virtual camera \"Tablet Mirror Camera\" for the whole PC. Windows allows this only with admin rights, once."],
["My phone or tablet is not detected.","Use a USB data cable, turn on USB debugging and tap Allow on the device. The built-in guide shows each step with pictures."],
["Does it work on Windows 10 or Mac?","Only Windows 11 for now, because the virtual camera needs it. There is no Mac version."],
["How do I get a trial key?","Send the Machine ID shown in the app to "+MAIL+". We reply with a 14-day key."]],
tr:[
["Windows “Bilgisayarınızı korudu” uyarısı veriyor. Güvenli mi?","Kurulum dosyası henüz dijital olarak imzalı değil; bu yüzden Windows her yeni programda bu uyarıyı gösterir. <b>Ek bilgi</b>'ye, ardından <b>Yine de çalıştır</b>'a tıklayın. İndirdiğiniz dosyanın SHA-256 değerini sürüm notlarındakiyle karşılaştırarak doğrulayabilirsiniz."],
["Görüntülerim bilgisayarımdan dışarı çıkıyor mu?","Hayır. Görüntü, cihazdan USB kabloyla bilgisayarınıza gelir ve orada işlenir. Hesap da yok, bulut da. Görüntülü görüşme uygulaması (Zoom, Meet...) yalnızca kamera olarak seçtiğinizi paylaşır."],
["Kurulum neden yönetici izni istiyor?","\"Tablet Mirror Camera\" sanal kamerasını bilgisayara eklemek için. Windows buna yalnızca yönetici izniyle, bir kez izin veriyor."],
["Telefonum ya da tabletim görünmüyor, ne yapmalıyım?","USB veri kablosu kullandığınızdan emin olun, USB hata ayıklamayı açın ve cihazda çıkan soruda <b>İzin ver</b>'e dokunun. Uygulamadaki rehber her adımı resimlerle gösteriyor."],
["Windows 10'da ya da Mac'te çalışır mı?","Şimdilik yalnızca Windows 11'de çalışıyor; sanal kamera Windows 11 gerektiriyor. Mac sürümü yok."],
["Deneme anahtarını nasıl alırım?","Uygulamada görünen Makine Kimliğini "+MAIL+" adresine gönderin. 14 günlük anahtarı size e-postayla iletelim."]]};
function gmail(s,b){return "https://mail.google.com/mail/?view=cm&fs=1&to="+MAIL+"&su="+encodeURIComponent(s)+"&body="+encodeURIComponent(b)}
function mail(s,b){return "mailto:"+MAIL+"?subject="+encodeURIComponent(s)+"&body="+encodeURIComponent(b)}
function setLang(l){
  try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.title=T[l].tTitle;var md=document.querySelector("meta[name=description]");if(md)md.setAttribute("content",T[l].tDesc);
  document.querySelectorAll("[data-i]").forEach(function(el){var v=T[l][el.dataset.i];if(v!==undefined)el.innerHTML=v});
  document.getElementById("faqbox").innerHTML=FAQ[l].map(function(q){return "<details><summary>"+q[0]+"</summary><p>"+q[1]+"</p></details>"}).join("");
  document.getElementById("trialmail").href=gmail(T[l].mTrialS,T[l].mTrialB);document.getElementById("trialmail2").href=mail(T[l].mTrialS,T[l].mTrialB);
  document.getElementById("buymail").href=gmail(T[l].mBuyS,T[l].mBuyB);document.getElementById("buymail2").href=mail(T[l].mBuyS,T[l].mBuyB);
  document.getElementById("b-en").className=l=="en"?"on":"";document.getElementById("b-tr").className=l=="tr"?"on":"";
}
var L="en";try{L=localStorage.getItem("lang")||"en"}catch(e){}
var qm=(location.search.match(/lang=(en|tr)/)||[])[1];if(qm)L=qm;
setLang(L);
if("IntersectionObserver" in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12});document.querySelectorAll(".rv").forEach(function(el){io.observe(el)})}else{document.querySelectorAll(".rv").forEach(function(el){el.classList.add("in")})}
</script>
